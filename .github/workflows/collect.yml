name: V-sport adatgyűjtés

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect.yml"
      - "package.json"
      - "src/**"

permissions:
  contents: write

concurrency:
  group: v-sport-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Repository letöltése
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Függőségek telepítése
        run: npm install

      - name: Chromium telepítése
        run: npx playwright install --with-deps chromium

      - name: Két mintavétel 2,5 perc eltéréssel
        env:
          SAMPLE_COUNT: "2"
          SAMPLE_INTERVAL_SECONDS: "150"
        run: npm run collect

      - name: Eredmény mentése
        run: |
          git config user.name "v-sport-adatfigyelo[bot]"
          git config user.email "v-sport-adatfigyelo@users.noreply.github.com"
          git add data package-lock.json
          if git diff --cached --quiet; then
            echo "Nincs új mentendő adat."
          else
            git commit -m "Adatgyűjtés: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
